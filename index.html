<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Collaborative Workshop</title>

  <link rel="stylesheet" href="case-style.css?v=2">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="cases.js?v=2" defer></script>
  <script src="session.js?v=2" defer></script>
</head>

<body>

  <section id="authScreen">
    <h1>Collaborative Workshop</h1>
    <p>Connexion à l’espace de travail partagé.</p>

    <form id="loginForm">
      <label>
        Email
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          required
        >
      </label>

      <label>
        Mot de passe
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button type="submit">Se connecter</button>
    </form>

    <p id="authStatus" role="status"></p>
  </section>

  <div id="appShell" hidden>

    <header>
      <h1>Collaborative Workshop</h1>

      <p>
        Atelier de réflexion partagé.
      </p>

      <div id="account">
        <span id="currentUser"></span>
        <button id="logout">Déconnexion</button>
      </div>

      <nav>
        <button id="add">+ Ajouter une case</button>
        <button id="minus" aria-label="Dézoomer">−</button>
        <span id="zoomValue">100%</span>
        <button id="plus" aria-label="Zoomer">+</button>
        <button id="fit">Recentrer</button>
        <button id="export">Exporter le tableau</button>
        <button id="importButton">Importer un tableau</button>
        <button id="retry">Réessayer la synchronisation</button>
        <input id="import" type="file" accept=".json" hidden>
      </nav>

      <p id="unreadCount">0 case(s) à consulter</p>

      <p id="status" role="status">
        Déplace les cases avec ☰, relie-les avec leur bouton.
        Clique un trait pour le supprimer.
      </p>
    </header>

    <main>

      <div id="view">
        <p id="emptyBoard">Ajoute une case pour commencer un sujet.</p>
        <div id="world">
          <svg id="lines" aria-label="Liens entre les cases"></svg>
          <div id="nodes"></div>
        </div>
      </div>


    </main>

  </div>

</body>
</html>
